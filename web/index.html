<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>동물상 소개팅</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- ONNX Runtime Web: 브라우저에서 얼굴상 분류 모델 실행 -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.20.1/dist/ort.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🐾 동물상 소개팅</div>
    <div id="auth-area"></div>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main class="wrap">
    <!-- 1. 얼굴 분석 -->
    <section class="card" id="step-face">
      <h2><span class="num">1</span> 내 얼굴상 알아보기</h2>
      <label class="consent">
        <input type="checkbox" id="consent">
        사진은 내 브라우저 안에서만 분석되고 어디에도 전송·저장되지 않는 것에 동의합니다.
      </label>
      <div class="row">
        <button id="btn-camera" class="primary" disabled>📷 카메라 켜기</button>
        <label class="btn" id="lbl-upload" aria-disabled="true">🖼️ 사진 올리기
          <input type="file" id="file" accept="image/*" hidden disabled>
        </label>
      </div>
      <div id="vision-status" class="muted"></div>
      <div class="camera" id="camera-box" hidden>
        <video id="video" playsinline muted></video>
        <button id="btn-shot" class="primary">촬영하기</button>
      </div>
      <canvas id="frame" hidden></canvas>
      <div id="face-result" class="result" hidden>
        <canvas id="face" class="face-thumb" width="224" height="224"></canvas>
        <div>
          <div class="muted">당신은</div>
          <div class="type" id="type-name"></div>
          <p id="type-desc"></p>
          <details>
            <summary>분석 상세 (개발용)</summary>
            <ul id="prob-list" class="probs"></ul>
          </details>
        </div>
      </div>
    </section>

    <!-- 2. 프로필 & 이상형 -->
    <section class="card" id="step-profile" hidden>
      <h2><span class="num">2</span> 프로필 &amp; 이상형</h2>
      <form id="profile-form" class="form">
        <label>닉네임 <input name="nickname" maxlength="20" required placeholder="예: 주말캠핑러"></label>
        <div class="field">
          <span>성별</span>
          <label class="radio"><input type="radio" name="gender" value="M" required> 남</label>
          <label class="radio"><input type="radio" name="gender" value="F"> 여</label>
        </div>
        <label>나이 <input name="age" type="number" min="19" max="99" required value="23"></label>
        <label>찾는 상대
          <select name="seek">
            <option value="F">여성</option><option value="M">남성</option><option value="any">상관없음</option>
          </select>
        </label>
        <div class="field">
          <span>선호 나이</span>
          <input name="ageMin" type="number" min="19" max="99" value="20" class="short"> ~
          <input name="ageMax" type="number" min="19" max="99" value="30" class="short">
        </div>
        <div class="field col">
          <span>취미 (여러 개 선택)</span>
          <div id="hobby-chips" class="chips"></div>
        </div>
        <div class="field col">
          <span>이상형 동물상 (누른 순서대로 1·2·3순위, 최대 3개)</span>
          <div id="pref-chips" class="chips"></div>
        </div>
        <div class="row">
          <button type="submit" class="primary" data-mode="demo">💘 데모 후보에서 찾기</button>
          <button type="submit" data-mode="real" id="btn-real" hidden>💾 저장하고 실제 회원 중에서 찾기</button>
        </div>
        <div id="form-msg" class="muted"></div>
      </form>
    </section>

    <!-- 3. 추천 결과 -->
    <section class="card" id="step-match" hidden>
      <h2><span class="num">3</span> 추천 상대 Top 5 <small id="match-source" class="muted"></small></h2>
      <ol id="match-list" class="matches"></ol>
      <p class="muted small">점수 = 0.8 × 상호 취향 점수(내 이상형 적합도와 상대 이상형 적합도의 평균) + 0.2 × 취미 겹침</p>
    </section>
  </main>

  <!-- 로그인 / 회원가입 -->
  <dialog id="auth-dialog">
    <form id="auth-form" method="dialog" class="form">
      <h3>로그인 / 회원가입</h3>
      <label>이메일 <input name="email" type="email" required autocomplete="email"></label>
      <label>비밀번호 (6자 이상) <input name="password" type="password" minlength="6" required autocomplete="current-password"></label>
      <div class="row">
        <button value="signin" class="primary">로그인</button>
        <button value="signup">회원가입</button>
        <button value="cancel" formnovalidate>닫기</button>
      </div>
      <div id="auth-msg" class="muted"></div>
    </form>
  </dialog>
</body>
</html>
